<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経費精算システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hub-wrap">
  <div class="hub-intro">
    <div class="brand-stamp">経</div>
    <h2>経費精算システム</h2>
    <p>利用する画面を選択してください</p>
  </div>

  <div class="hub-grid">
    <a href="employee.html" class="hub-card role-employee">
      <div class="hub-icon">社</div>
      <h3>社員画面</h3>
      <p>経費を申請する<br>利用日・金額・利用目的の入力や、領収書からの自動入力ができます。</p>
      <span class="hub-cta">申請する →</span>
    </a>

    <a href="admin.html" class="hub-card role-admin">
      <div class="hub-icon">本</div>
      <h3>本部画面</h3>
      <p>申請を確認・管理する<br>申請一覧の確認、ステータス変更、検索、削除ができます。</p>
      <span class="hub-cta">一覧を見る →</span>
    </a>
  </div>
</div>

</html>
